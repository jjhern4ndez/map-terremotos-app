<div class="relative">
  <app-map></app-map>
  <app-earthquake-list class="absolute right-4 top-4 z-10"></app-earthquake-list>

  @for (quake of [store.selectedEarthquake()]; track quake?.id) {
    @if (quake) {
      <app-earthquake-card
        class="absolute bottom-4 left-4 z-10"
        [earthquake]="quake"
        (close)="store.clearSelection()"
      ></app-earthquake-card>
    }
  }
</div>
