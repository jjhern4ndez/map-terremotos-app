<div class="relative">
  <app-map></app-map>
  <app-earthquake-list class="absolute right-4 top-4 z-10"></app-earthquake-list>

  @for (quake of [store.selectedEarthquake()]; track quake?.id) {
    @if (quake) {
      <app-earthquake-card
        [earthquake]="quake"
        (close)="store.clearSelection()"
      ></app-earthquake-card>
    }
  }

  @if (store.loading()) {
    <div class="absolute inset-0 z-20 flex flex-col items-center justify-center gap-3 bg-white/70 backdrop-blur-sm">
      <div class="h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-red-600"></div>
      <p class="text-sm font-medium text-gray-700">Cargando mapa y datos...</p>
    </div>
  }
</div>
